name: Garmin Sync

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect cryptography

      - name: Restore Garmin token store (optional, for MFA accounts)
        env:
          GARMINTOKENS_B64: ${{ secrets.GARMINTOKENS_B64 }}
        run: |
          if [ -n "$GARMINTOKENS_B64" ]; then
            mkdir -p "$HOME/.garminconnect"
            echo "$GARMINTOKENS_B64" | base64 -d | tar -xz -C "$HOME/.garminconnect"
            echo "token store restored"
          else
            echo "no token store secret set, will use credential login"
          fi

      - name: Run telemetry relay
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
        run: python garmin_sync.py

      - name: Commit encrypted feed
        run: |
          git config user.name "bio-command-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telemetry.enc
          git diff --cached --quiet || git commit -m "telemetry sync"
          git push
